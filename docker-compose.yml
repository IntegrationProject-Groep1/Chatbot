services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: chatbot-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  # This container will run our mock services to simulate Planning/Facturatie
  mock-services:
    build: .
    container_name: chatbot-mock-services
    depends_on:
      - rabbitmq
    environment:
      - RABBITMQ_HOST=rabbitmq
    command: python tests/mock_services.py
