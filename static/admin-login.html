<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — Shift Admin</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0a0a0f;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #e2e8f0;
    }

    .card {
      width: 100%;
      max-width: 380px;
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 12px;
      padding: 40px 36px 32px;
      box-shadow: 0 24px 64px rgba(0,0,0,.5);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
    }
    .logo-icon {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 16px; color: #fff;
    }
    .logo-text { font-size: 15px; font-weight: 600; color: #f1f5f9; }
    .logo-sub  { font-size: 11px; color: #64748b; margin-top: 1px; }

    h1 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 6px;
      letter-spacing: -.02em;
      color: #f1f5f9;
    }
    .sub {
      font-size: 13px;
      color: #64748b;
      margin-bottom: 28px;
    }

    label {
      display: block;
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: #94a3b8;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 7px;
      padding: 10px 13px;
      font-size: 14px;
      color: #f1f5f9;
      margin-bottom: 16px;
      outline: none;
      transition: border-color .15s;
      caret-color: #60a5fa;
    }
    input:focus { border-color: #3b82f6; }

    button[type=submit] {
      width: 100%;
      padding: 11px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 7px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 4px;
      transition: background .15s, opacity .15s;
    }
    button[type=submit]:hover { background: #1d4ed8; }
    button[type=submit]:disabled { opacity: .5; cursor: not-allowed; }

    .error {
      margin-top: 14px;
      padding: 9px 12px;
      background: rgba(239,68,68,.12);
      border: 1px solid rgba(239,68,68,.3);
      border-radius: 6px;
      font-size: 13px;
      color: #fca5a5;
      display: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-icon">S</div>
      <div>
        <div class="logo-text">Shift Festival</div>
        <div class="logo-sub">Admin Console</div>
      </div>
    </div>

    <h1>Sign in</h1>
    <p class="sub">Access restricted to authorized administrators.</p>

    <form id="loginForm" novalidate>
      <label for="username">Username</label>
      <input id="username" type="text" autocomplete="username" autofocus required />

      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required />

      <button type="submit" id="submitBtn">Sign in</button>
      <div class="error" id="errorMsg"></div>
    </form>
  </div>

  <script>
    const form   = document.getElementById('loginForm');
    const errEl  = document.getElementById('errorMsg');
    const btn    = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errEl.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Signing in…';

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value.trim(),
            password: document.getElementById('password').value,
          }),
        });

        if (res.ok) {
          window.location.replace('/');
        } else {
          const d = await res.json().catch(() => ({}));
          errEl.textContent = d.error || 'Invalid credentials. Try again.';
          errEl.style.display = 'block';
        }
      } catch {
        errEl.textContent = 'Network error — is the server running?';
        errEl.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Sign in';
      }
    });
  </script>
</body>
</html>
