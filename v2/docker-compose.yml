services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: chatbot-v2-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  mock-services:
    build: .
    container_name: chatbot-v2-mocks
    depends_on:
      - rabbitmq
    environment:
      - RABBITMQ_HOST=rabbitmq
    command: python src/mock_services.py

  chatbot:
    build: .
    container_name: chatbot-v2
    ports:
      - "8000:8000"
    depends_on:
      - rabbitmq
    env_file: .env
    environment:
      - RABBITMQ_HOST=rabbitmq
