name: Deploy Pipeline

# Flow:
#   dev branch  → CI runt → deploy triggert (workflow_run, branches: dev)    → latest-dev
#   v* tag      → CI runt → deploy triggert (workflow_run, branches: "v*")   → latest + v-tag
#   main branch → CI runt → deploy triggert NIET (niet in branch filter)
#
# CI moet altijd eerst slagen — workflow_run garandeert dit voor alle gevallen.
# workflow_dispatch is een noodmaatregel en omzeilt de tag-gebaseerde flow.

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed
    branches:
      - dev    # auto-deploy na CI op dev
      - "v*"   # prod release: head_branch = tag naam bij tag-triggered CI
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}
          fetch-tags: true

      - name: Determine deploy target
        id: vars
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            BRANCH="${{ github.ref_name }}"
            V_TAG=""
            MANUAL=true
          else
            BRANCH="${{ github.event.workflow_run.head_branch }}"
            V_TAG=$(git tag --points-at HEAD | grep -E '^v' | head -1 || true)
            # head_branch is de tag naam zelf bij een tag-triggered CI run
            if [[ -z "$V_TAG" && "$BRANCH" =~ ^v[0-9] ]]; then
              V_TAG="$BRANCH"
            fi
            MANUAL=false
          fi

          if [[ "$BRANCH" == "dev" ]]; then
            echo "should_deploy=true" >> $GITHUB_OUTPUT
            echo "tag=latest-dev"     >> $GITHUB_OUTPUT
            echo "extra_tag="         >> $GITHUB_OUTPUT
          elif [[ -n "$V_TAG" ]]; then
            echo "should_deploy=true" >> $GITHUB_OUTPUT
            echo "tag=latest"         >> $GITHUB_OUTPUT
            echo "extra_tag=$V_TAG"   >> $GITHUB_OUTPUT
          elif [[ "$MANUAL" == "true" ]]; then
            echo "should_deploy=true" >> $GITHUB_OUTPUT
            echo "tag=latest"         >> $GITHUB_OUTPUT
            echo "extra_tag="         >> $GITHUB_OUTPUT
          else
            echo "should_deploy=false" >> $GITHUB_OUTPUT
            echo "tag="                >> $GITHUB_OUTPUT
            echo "extra_tag="          >> $GITHUB_OUTPUT
          fi

      - name: Lowercase repo name
        if: steps.vars.outputs.should_deploy == 'true'
        id: repo_name
        run: echo "value=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry (GHCR)
        if: steps.vars.outputs.should_deploy == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image (dev)
        if: steps.vars.outputs.tag == 'latest-dev'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.repo_name.outputs.value }}:latest-dev
            ghcr.io/${{ steps.repo_name.outputs.value }}:${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Build and push Docker image (prod release)
        if: steps.vars.outputs.tag == 'latest' && steps.vars.outputs.extra_tag != ''
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.repo_name.outputs.value }}:latest
            ghcr.io/${{ steps.repo_name.outputs.value }}:${{ steps.vars.outputs.extra_tag }}
            ghcr.io/${{ steps.repo_name.outputs.value }}:${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Build and push Docker image (handmatige dispatch)
        if: steps.vars.outputs.tag == 'latest' && steps.vars.outputs.extra_tag == ''
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.repo_name.outputs.value }}:latest
            ghcr.io/${{ steps.repo_name.outputs.value }}:${{ github.event.workflow_run.head_sha || github.sha }}
