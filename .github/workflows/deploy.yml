name: Deploy Pipeline

# Prod:  push een v* tag → CI runt op die tag → deploy triggert via workflow_run
# Dev:   push naar dev  → CI runt → deploy triggert via workflow_run
# Manual: workflow_dispatch als noodmaatregel

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed
    branches:
      - dev        # auto-deploy na CI op dev branch
  push:
    tags:
      - "v*"       # prod release: tag push triggert deploy direct
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    # workflow_run: alleen doorgaan als CI geslaagd is
    # push (tag): altijd doorgaan — tag wordt pas gezet na handmatige goedkeuring
    # workflow_dispatch: altijd doorgaan
    if: >
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-tags: true

      - name: Determine deploy target
        id: vars
        run: |
          EVENT="${{ github.event_name }}"

          if [[ "$EVENT" == "push" ]]; then
            # Tag push — ref_name is de tag zelf (bv. v1.2.3)
            V_TAG="${{ github.ref_name }}"
            echo "should_deploy=true" >> $GITHUB_OUTPUT
            echo "tag=latest"         >> $GITHUB_OUTPUT
            echo "extra_tag=$V_TAG"   >> $GITHUB_OUTPUT

          elif [[ "$EVENT" == "workflow_run" ]]; then
            # Dev branch auto-deploy na CI
            BRANCH="${{ github.event.workflow_run.head_branch }}"
            if [[ "$BRANCH" == "dev" ]]; then
              echo "should_deploy=true" >> $GITHUB_OUTPUT
              echo "tag=latest-dev"     >> $GITHUB_OUTPUT
              echo "extra_tag="         >> $GITHUB_OUTPUT
            else
              echo "should_deploy=false" >> $GITHUB_OUTPUT
              echo "tag="                >> $GITHUB_OUTPUT
              echo "extra_tag="          >> $GITHUB_OUTPUT
            fi

          elif [[ "$EVENT" == "workflow_dispatch" ]]; then
            # Handmatige dispatch — alleen op main/dev zinvol
            BRANCH="${{ github.ref_name }}"
            if [[ "$BRANCH" == "dev" ]]; then
              echo "should_deploy=true" >> $GITHUB_OUTPUT
              echo "tag=latest-dev"     >> $GITHUB_OUTPUT
              echo "extra_tag="         >> $GITHUB_OUTPUT
            else
              echo "should_deploy=true" >> $GITHUB_OUTPUT
              echo "tag=latest"         >> $GITHUB_OUTPUT
              echo "extra_tag="         >> $GITHUB_OUTPUT
            fi

          else
            echo "should_deploy=false" >> $GITHUB_OUTPUT
            echo "tag="                >> $GITHUB_OUTPUT
            echo "extra_tag="          >> $GITHUB_OUTPUT
          fi

      - name: Lowercase repo name
        if: steps.vars.outputs.should_deploy == 'true'
        id: repo_name
        run: echo "value=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry (GHCR)
        if: steps.vars.outputs.should_deploy == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image (dev)
        if: steps.vars.outputs.tag == 'latest-dev'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.repo_name.outputs.value }}:latest-dev
            ghcr.io/${{ steps.repo_name.outputs.value }}:${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Build and push Docker image (prod release)
        if: steps.vars.outputs.tag == 'latest' && steps.vars.outputs.extra_tag != ''
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.repo_name.outputs.value }}:latest
            ghcr.io/${{ steps.repo_name.outputs.value }}:${{ steps.vars.outputs.extra_tag }}
            ghcr.io/${{ steps.repo_name.outputs.value }}:${{ github.sha }}

      - name: Build and push Docker image (handmatige dispatch)
        if: steps.vars.outputs.tag == 'latest' && steps.vars.outputs.extra_tag == ''
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.repo_name.outputs.value }}:latest
            ghcr.io/${{ steps.repo_name.outputs.value }}:${{ github.sha }}
